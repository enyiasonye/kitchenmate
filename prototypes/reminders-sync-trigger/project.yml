# PROTOTYPE — throwaway. Answers "Reminders sync trigger prototype" (issue #23).
# Generate the Xcode project with: xcodegen generate
name: SyncTriggerProbe
options:
  bundleIdPrefix: com.roehaus.prototype
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    DEVELOPMENT_TEAM: 2XF9ZJU79J
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SyncTriggerProbe:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sync Probe
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSRemindersFullAccessUsageDescription: Reads your grocery list to test when the daily sync runs. Nothing is changed.
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.roehaus.prototype.SyncTriggerProbe.refresh]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/SyncTriggerProbe.entitlements
      properties:
        aps-environment: development
