# PROTOTYPE — throwaway. Answers "Share sheet payload logger" (issue #21).
# Generate the Xcode project with: xcodegen generate
name: PayloadLogger
options:
  bundleIdPrefix: com.roehaus.prototype
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    DEVELOPMENT_TEAM: 2XF9ZJU79J
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PayloadLogger:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Payload Logger
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/PayloadLogger.entitlements
      properties:
        com.apple.security.application-groups: [group.com.roehaus.prototype.payloadlogger]
    dependencies:
      - target: LogShare
  LogShare:
    type: app-extension
    platform: iOS
    sources: [Extension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roehaus.prototype.PayloadLogger.LogShare
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Log Payload
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Accept any attachment so no source app is filtered out.
            # (TRUEPREDICATE is rejected by App Store Connect, which TestFlight goes through.)
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $a,
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.item"
              OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.content"
              OR ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.property-list").@count >= 1).@count >= 1
            NSExtensionJavaScriptPreprocessingFile: Preprocess
    entitlements:
      path: Extension/LogShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.roehaus.prototype.payloadlogger]
